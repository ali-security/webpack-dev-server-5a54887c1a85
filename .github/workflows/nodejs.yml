name: webpack-dev-server

# sealed build: dispatched on the ali-security fork
on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Optional jest test path pattern to run a subset of tests"
        required: false
        default: ""

jobs:
  lint:
    name: Lint - ${{ matrix.os }} - Node v${{ matrix.node-version }}

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node-version: [16.x]

    runs-on: ${{ matrix.os }}

    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build types
        run: npm run build:types

      - name: Check types
        run: if [ -n "$(git status types --porcelain)" ]; then echo "Missing types. Update types by running 'npm run build:types'"; exit 1; else echo "All types are valid"; fi

  test:
    name: Test - ${{ matrix.os }} - Node v${{ matrix.node-version }}, Webpack ${{ matrix.webpack-version }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022, macos-latest]
        node-version: [12.x, 14.x, 16.x, 17.x]
        webpack-version: [latest]
        exclude:
          - os: macos-latest
            node-version: 12.x
          - os: macos-latest
            node-version: 14.x
        include:
          - node-version: 16.x
            os: ubuntu-latest
            webpack-version: 4

    runs-on: ${{ matrix.os }}

    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Update package.json for webpack@4
        if: matrix.webpack-version == '4'
        run: echo "`jq '.scripts.build="npm run build:client"' package.json`" > package.json

      - name: Install webpack ${{ matrix.webpack-version }}
        if: matrix.webpack-version == '4'
        run: npm i webpack@${{ matrix.webpack-version }} --save-dev --ignore-scripts

      - name: Link webpack-dev-server
        run: |
          cp -R client tmp-client
          npm link --ignore-scripts
          npm link webpack-dev-server --ignore-scripts
          rm -r client
          cp -R tmp-client client

      - name: Run tests for webpack version ${{ matrix.webpack-version }}
        run: npm run test:coverage -- --ci ${{ inputs.test-filter }}

  pack:
    name: Pack

    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 16.14.0
        uses: actions/setup-node@v4
        with:
          node-version: 16.14.0
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Pack
        run: npm pack

      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: webpack-dev-server-tgz
          path: webpack-dev-server-4.8.1.tgz
          if-no-files-found: error
